 (Orb)","name_ja":"O（オーブ）","part_type":"bit","generation":"Beyblade X","product_code":"BX-16","type":"unknown","notes":"Shaft-tip bit. Takara Tomy Plus One Bit campaign expands O as オーブ (Orb). First listed on random-booster featured combo BX-16 Viper Tail 5-80O. Official JP copy: downward blades attack from above to stop the opponent, aiming for a spin finish. Cited pages do not print Attack/Defense/Stamina/Balance for O alone; type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/news/news251114.html","label":"Takara Tomy Plus One Bit campaign (O/オーブ)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx16.html","label":"Takara Tomy BX-16 product page (5-80O)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx16.png","label":"Takara Tomy BX-16 parts-detail sheet (O/オーブ)","kind":"official"}]},{"id":"bit-dot","name":"D (Dot)","name_ja":"D（ドット）","part_type":"bit","generation":"Beyblade X","product_code":"BX-35","type":"defense","notes":"Shaft-tip bit. Takara Tomy Plus One Bit campaign expands D as ドット (Dot). First listed on random-booster prize BX-35 Black Shell 4-60D. Official JP copy: downward defensive blades plus a low ratchet and a hard-to-push-out bit, described as excelling at enduring low-position attacks. Defense label is from that official combo description. Hasbro English product: Obsidian Shell 4-60D (item G1533).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/news/news251114.html","label":"Takara Tomy Plus One Bit campaign (D/ドット)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx35.html","label":"Takara Tomy BX-35 Random Booster Vol.4 (4-60D)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-obsidian-shell-4-60-d-booster-pack-set/G1533","label":"Hasbro Obsidian Shell 4-60D booster (G1533)","kind":"official"}]},{"id":"bit-elevate","name":"E (Elevate)","name_ja":"E（エレベート）","part_type":"bit","generation":"Beyblade X","product_code":"BX-36","type":"unknown","notes":"Shaft-tip bit. Takara Tomy BX-36 parts-detail sheet expands E as エレベート (Elevate): large guide keeps posture; the tip lifts during X Dash to enable smash attacks. First listed on random-booster featured combo BX-36 Whale Wave 5-80E. Official JP copy: smash-attack blade plus a guided bit whose tip lifts on X Dash to strike from above. Cited pages do not print Attack/Defense/Stamina/Balance for E alone; type left unknown. Hasbro English product: Tide Whale 5-80E (item G1669).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx36.html","label":"Takara Tomy BX-36 Whale Wave Select (5-80E)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx36.png","label":"Takara Tomy BX-36 parts-detail sheet (E/エレベート)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-tide-whale-5-80-e-booster-pack-set/G1669","label":"Hasbro Tide Whale 5-80E booster (G1669)","kind":"official"}]},{"id":"bit-quake","name":"Q (Quake)","name_ja":"Q（クエイク）","part_type":"bit","generation":"Beyblade X","product_code":"BX-31","type":"unknown","notes":"Shaft-tip bit. Takara Tomy BX-31 parts-detail sheet expands Q as クエイク (Quake): diagonally cut tip that bounces so the Bey moves irregularly. First listed on random-booster prize BX-31 Tyranno Beat 4-70Q. Official JP copy: diagonally cut bouncing bit plus a thick serrated eight-blade for unpredictable hits. Cited pages do not print Attack/Defense/Stamina/Balance for Q alone; type left unknown. Hasbro English product: Beat Tyranno 4-70Q dual pack (item G1542).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx31.html","label":"Takara Tomy BX-31 Random Booster Vol.3 (4-70Q)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx31.png","label":"Takara Tomy BX-31 parts-detail sheet (Q/クエイク)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-beat-tyranno-4-70-q-and-knife-shinobi-4-80-hn-dual-pack-set/G1542","label":"Hasbro Beat Tyranno 4-70Q dual pack (G1542)","kind":"official"}]},{"id":"bit-metal-needle","name":"MN (Metal Needle)","name_ja":"MN（メタルニードル）","part_type":"bit","generation":"Beyblade X","product_code":"UX-05","type":"unknown","notes":"Shaft-tip bit. Takara Tomy UX-05 parts-detail sheet expands MN as メタルニードル (Metal Needle): N-bit tip in metal for weight and lower friction / higher stability. First listed on random-booster featured combo UX-05 Shinobi Shadow 1-80MN. Official JP copy: smooth blade plus a metal-tipped high-stability bit, specialized for slipping attacks. Cited pages do not print Attack/Defense/Stamina/Balance for MN alone; type left unknown. Hasbro English product: Shadow Shinobi 1-80MN UX starter (item G1751).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux05.html","label":"Takara Tomy UX-05 Shinobi Shadow Select (1-80MN)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_ux05.png","label":"Takara Tomy UX-05 parts-detail sheet (MN/メタルニードル)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-shadow-shinobi-1-80-mn-ux-starter-pack-top-and-launcher/G1751","label":"Hasbro Shadow Shinobi 1-80MN UX starter (G1751)","kind":"official"}]},{"id":"bit-disk-spike","name":"DS (Disk Spike)","name_ja":"DS（ディスクスパイク）","part_type":"bit","generation":"Beyblade X","product_code":"BX-50","type":"defense","notes":"Shaft-tip bit. Takara Tomy BX-50 parts-detail sheet expands DS as ディスクスパイク (Disk Spike). First listed on random-booster prize BX-50 Heavens Ring 0-80DS. Official JP copy: circular impact-dispersing Expand Blade plus a bit that holds posture at stadium center, described as a Defense Type Beyblade. Defense label is from that official product description. Do not confuse with Unique Line Expand lettering such as Ghost Circle M-85DS in the same pack.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx50.html","label":"Takara Tomy BX-50 Random Booster Vol.11 (0-80DS)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BX50.png","label":"Takara Tomy BX-50 parts-detail sheet (DS/ディスクスパイク)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-50_manual.pdf","label":"Takara Tomy BX-50 instruction manual (PDF)","kind":"official"}]},{"id":"bit-narrow","name":"Nr (Narrow)","name_ja":"Nr（ナロー）","part_type":"bit","generation":"Beyblade X","product_code":"CX-18","type":"stamina","notes":"Shaft-tip bit. Takara Tomy CX-18 parts-detail sheet expands Nr as ナロー (Narrow): thin spherical tip for long spin; 10-tooth gear limits X Dash speed to reduce stamina loss. First listed on random-booster featured combo CX-18 Brachio Whip OW5-70Nr. Official JP copy: thick circular outer-weighted blade plus a bit that prevents stamina loss, described as a Stamina Type Beyblade. Stamina label is from that official product description.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx18.html","label":"Takara Tomy CX-18 Brachio Whip Select (5-70Nr)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_CX18.png","label":"Takara Tomy CX-18 parts-detail sheet (Nr/ナロー)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Custom Line)","kind":"official"}]},{"id":"bit-gear-needle","name":"GN (Gear Needle)","name_ja":"GN（ギヤニードル）","part_type":"bit","generation":"Beyblade X","product_code":"BX-27","type":"unknown","notes":"Shaft-tip bit. Takara Tomy BX-27 / CX-19 parts-detail sheets expand GN as ギヤニードル (Gear Needle): gear extends around a pointed tip so the Bey can hold stadium center and still X Dash. First listed on random-booster featured combo BX-27 Sphinx Cowl 9-80GN; also printed on CX-19 Croco Tread TQ5-50GN. Cited pages do not print Attack/Defense/Stamina/Balance for GN alone; type left unknown. Hasbro English product: Cowl Sphinx 9-80GN (item G1530). Do not confuse with assist-blade letter G.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx27.html","label":"Takara Tomy BX-27 Sphinx Cowl Select (9-80GN)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx27.png","label":"Takara Tomy BX-27 parts-detail sheet (GN/ギヤニードル)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx19.html","label":"Takara Tomy CX-19 Croco Tread Select (5-50GN)","kind":"official"}]},{"id":"bit-kick","name":"K (Kick)","name_ja":"K（キック）","part_type":"bit","generation":"Beyblade X","product_code":"CX-05","type":"unknown","notes":"Shaft-tip bit. Takara Tomy CX-05 parts-detail sheet expands K as キック (Kick). First listed on random-booster prize CX-05 Hells Reaper T 4-70K (ヘルズリーパーT4-70K). Official JP copy: two-mode blade plus a bit described as combining attack and defense for many matchups. Cited pages do not print Attack/Defense/Stamina/Balance for K alone; type left unknown. Do not confuse with assist-blade letter K (Knuckle).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx05.html","label":"Takara Tomy CX-05 Random Booster Vol.6 (4-70K)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_CX05.png","label":"Takara Tomy CX-05 parts-detail sheet (K/キック)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (CX-05 ランダムブースターVol.6)","kind":"official"}]},{"id":"bit-wall-ball","name":"WB (Wall Ball)","name_ja":"WB（ウォールボール）","part_type":"bit","generation":"Beyblade X","product_code":"CX-08","type":"unknown","notes":"Shaft-tip bit. Takara Tomy CX-08 parts-detail sheet expands WB as ウォールボール (Wall Ball). First listed on random-booster prize CX-08 Cerberus Flame W 5-80WB (ケルベロスフレイムW5-80WB). Official JP copy: two-layer thick circular blade plus a bit with high posture-holding performance that reduces stamina loss from hits and tilt. Cited pages do not print Attack/Defense/Stamina/Balance for WB alone; type left unknown. Also named on the same page for left-spin コバルトドラグーン4-55WB.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx08.html","label":"Takara Tomy CX-08 Random Booster Vol.7 (5-80WB)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_CX08.png","label":"Takara Tomy CX-08 parts-detail sheet (WB/ウォールボール)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (CX-08 ランダムブースターVol.7)","kind":"official"}]},{"id":"bit-gear-point","name":"GP (Gear Point)","name_ja":"GP（ギヤポイント）","part_type":"bit","generation":"Beyblade X","product_code":"BX-26","type":"unknown","notes":"Shaft-tip bit. Takara Tomy BX-26 parts-detail sheet expands GP as ギヤポイント (Gear Point): P-bit gear extended to the tip so movement changes more. First listed on booster BX-26 Unicorn Sting 5-60GP; also the bit in random-booster featured combo BX-39 Shelter Drake 7-80GP. Cited pages do not print Attack/Defense/Stamina/Balance for GP alone; type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx26.html","label":"Takara Tomy BX-26 product page (5-60GP)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx26.png","label":"Takara Tomy BX-26 parts-detail sheet (GP/ギヤポイント)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx39.html","label":"Takara Tomy BX-39 Shelter Drake Select (7-80GP)","kind":"official"}]},{"id":"dranzer-spiral","name":"Dranzer Spiral","name_ja":"ドランザースパイラル","part_type":"blade","generation":"Beyblade X","product_code":"BX-00","type":"balance","notes":"Takara Tomy Basic Line collab blade from booster BX-00 Dranzer Spiral 3-80T (released 2023-07-15). Official JP copy: Bakuten Shoot Beyblade Dranzer Spiral in Beyblade X form; balance-focused parts, described as excelling at both attack and stamina. Official product-page type icon is Balance (right-spin). Balance label is from that official icon / product copy. Hasbro English product name: Dranzer Spiral 3-80T Anniversary X-Over / X-Over Project (items F9584 and G1842, labeled Balance Type). Stock combo 3-80T uses existing ratchet 3-80 and bit T, not duplicated here. Official BX-00 manual lists blade 【ドランザースパイラル】, ratchet 【3-80】, and bit 【T】.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx00-ds.html","label":"Takara Tomy BX-00 Dranzer Spiral 3-80T product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-00_manual.pdf","label":"Takara Tomy BX-00 Dranzer Spiral instruction manual (PDF)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bxg01.png","label":"Takara Tomy BX-00 Dranzer Spiral parts-detail sheet","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-dranzer-spiral-3-80-t-anniversary-x-over-with-balance-type-top-and-launcher-ages-8-plus/F9584","label":"Hasbro Dranzer Spiral 3-80T Anniversary X-Over (F9584)","kind":"official"}]},{"id":"driger-slash","name":"Driger Slash","name_ja":"ドライガースラッシュ","part_type":"blade","generation":"Beyblade X","product_code":"BX-00","type":"balance","notes":"Takara Tomy Basic Line collab blade from booster BX-00 Driger Slash 4-80P (released 2024-04-27). Official JP copy: Bakuten Shoot Beyblade Driger Slash in Beyblade X form; shooting method can switch between aggressive movement and stamina-oriented movement for adaptable battles. Official product-page type icon is Balance (right-spin). Balance label is from that official icon. Hasbro English product name: Driger Slash 4-80P X-Over Project starter (item G1843, labeled Balance Type). Stock combo 4-80P uses existing ratchet 4-80 and bit P, not duplicated here.","sources":[ ra Tomy Beyblade X lineup (BX-00 ドラシエルシールド)","kind":"official"}]},{"id":"xeno-excalibur","name":"Xeno Excalibur","name_ja":"ゼノエクスカリバー","part_type":"blade","generation":"Beyblade X","product_code":"BX-00","type":"attack","notes":"Takara Tomy Basic Line collab blade from starter BX-00 Xeno Excalibur 3-60GF (official page date 2025-03-29). Official JP copy: Beyblade Burst Xeno Excalibur in Beyblade X form; Hold Launcher starter. High-speed easy-running bit plus a sword-shaped large single blade with high one-hit performance, described as realizing a high-power dash attack. Official product-page type icon is Attack (right-spin). Attack label is from that official icon / product copy. Stock combo 3-60GF uses existing ratchet 3-60; bit letters GF are printed in the product name but cited pages do not expand GF, so that bit is not added here.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx00-xc.html","label":"Takara Tomy BX-00 Xeno Excalibur 3-60GF product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BXG-13_manual.pdf","label":"Takara Tomy BXG-13 / BX-00 Xeno Excalibur manual (PDF)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BXG13.png","label":"Takara Tomy BX-00 Xeno Excalibur parts-detail sheet","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-00 ゼノエクスカリバー)","kind":"official"}]},{"id":"rock-leone","name":"Rock Leone","name_ja":"ロックレオーネ","part_type":"blade","generation":"Beyblade X","product_code":"BX-00","type":"defense","notes":"Takara Tomy Basic Line collab blade from booster BX-00 Rock Leone 6-80GN (official page date 2025-07-19). Official JP copy: Metal Fight Beyblade Rock Leone in Beyblade X form; counter-defense blade and bit combination described as swaying widely in stadium center while countering the opponent. Official product-page type icon is Defense (right-spin). Defense ent away. Official product-page type icon is Attack (right-spin). Attack label is from that official Attack Type line / icon. Also named in the Takara Tomy Mall BX-00 25th anniversary set. Stock combo 3-70RA uses existing ratchet 3-70; bit letters RA are printed in the product name but cited pages do not expand RA, so that bit is not added here.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx00-sp.html","label":"Takara Tomy BX-00 Storm Pegasis 3-70RA product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/bx00-sp_manual.pdf","label":"Takara Tomy BX-00 Storm Pegasis instruction manual (PDF)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BXG47.png","label":"Takara Tomy BX-00 Storm Pegasis parts-detail sheet","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx00-25set.html","label":"Takara Tomy BX-00 25th anniversary set (ストームペガシス3-70RA)","kind":"official"}]},{"id":"dran-dagger","name":"Dran Dagger","name_ja":"ドランダガー","part_type":"blade","generation":"Beyblade X","product_code":"BX-20","type":"attack","notes":"Takara Tomy Basic Line blade from set BX-20 Dran Dagger Deck Set (released 2023-11-02). Featured stock combo is ドランダガー4-60R. Official JP copy: six-blade design with high rapid-hit performance, paired with a bit that is easy to keep dashing, for continuous X Dash and consecutive attacks. Official parts-detail sheet type icon is Attack (right-spin). Attack label is from that official icon / product copy. Also sold as BX-00 Dran Dagger 2-80GP Metal Coat: Black Giants Ver. Hasbro English product name: Dagger Dran (item G1670, 4-70Q booster). Stock ratchet 4-60 is already in the catalog; bit R is added as a separate row.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx20.html","label":"Takara Tomy BX-20 Dran Dagger Deck Set product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx20B.png","label":"Takara Tomy BX-20 parts-detail sheet (ドランダガー4-60R)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-20_manual.pdf","label":"Takara Tomy BX-20 instruction manual (PDF)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-dagger-dran-4-70-q-booster-pack-set/G1670","label":"Hasbro Dagger Dran 4-70Q booster (G1670)","kind":"official"}]},{"id":"hells-chain","name":"Hells Chain","name_ja":"ヘルズチェイン","part_type":"blade","generation":"Beyblade X","product_code":"BX-21","type":"balance","notes":"Takara Tomy Basic Line blade from set BX-21 Hells Chain Deck Set (released 2023-11-02). Featured stock combo is ヘルズチェイン5-60HT. Official JP copy: upper and lower blade faces have different performance, paired with a mid-height ratchet and bit, for matching opponents of any height. Official parts-detail sheet type icon is Balance (right-spin). Balance label is from that official icon / product copy. Also sold as BX-00 Hells Chain 5-60HT Metal Coat: Black (app/event). Hasbro English product name: Chain Incendio (item G0196, 5-60HT dual pack). Stock ratchet 5-60 is already in the catalog; bit HT is added as a separate row.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx21.html","label":"Takara Tomy BX-21 Hells Chain Deck Set product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx21_p.png","label":"Takara Tomy BX-21 parts-detail sheet (ヘルズチェイン5-60HT)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-21_manual.pdf","label":"Takara Tomy BX-21 instruction manual (PDF)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-chain-incendio-5-60-ht-and-arrow-wizard-4-60-n-top-dual-pack-set-ages-8-plus/G0196","label":"Hasbro Chain Incendio 5-60HT dual pack (G0196)","kind":"official"}]},{"id":"weiss-tiger","name":"Weiss Tiger","name_ja":"ヴァイスタイガー","part_type":"blade","generation":"Beyblade X","product_code":"BX-33","type":"balance","notes":"Takara Tomy Basic Line blade from booster BX-33 Weiss Tiger 3-60U (released 2024-06-15). Official JP copy: blade combining attack, defense, and stamina performance, paired with a bit that can dash, counter, and evade, for battles against any opponent. Official parts-detail sheet type icon is Balance (right-spin). Balance label is from that official icon / 3-type product copy. Hasbro English product name: Pearl Tiger (item G1686, 3-60U dual pack with Gill Shark 4-70O). Stock ratchet 3-60 is already in the catalog; bit U is added as a separate row.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx33.html","label":"Takara Tomy BX-33 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx33.png","label":"Takara Tomy BX-33 parts-detail sheet (ヴァイスタイガー3-60U)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-33_manual.pdf","label":"Takara Tomy BX-33 instruction manual (PDF)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-gill-shark-4-70-o-and-pearl-tiger-3-60-u-dual-pack-set/G1686","label":"Hasbro Pearl Tiger 3-60U dual pack (G1686)","kind":"official"}]},{"id":"crimson-garuda","name":"Crimson Garuda","name_ja":"クリムゾンガルーダ","part_type":"blade","generation":"Beyblade X","product_code":"BX-38","type":"balance","notes":"Takara Tomy Basic Line blade from booster BX-38 Crimson Garuda 4-70TP (released 2024-11-02). Official JP copy: upper face has low stamina loss and the underside is strong at counter attacks, so upper and lower faces differ; paired with a height-switching bit for matching opponents of various heights. Official parts-detail sheet type icon is Balance (right-spin) with a mode-change mark. Balance label is from that official icon / product copy. Hasbro English product name: Scarlet Garuda (item G1673, labeled Balance Type). Stock ratchet 4-70 is alr fficial"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/news/news241115_4.html","label":"Takara Tomy news: rare-bey コバルトドレイク4-60F クリアVer.","kind":"official"}]},{"id":"tricera-press","name":"Tricera Press","name_ja":"トリケラプレス","part_type":"blade","generation":"Beyblade X","product_code":"BX-44","type":"defense","notes":"Takara Tomy Basic Line blade from booster BX-44 Tricera Press M-85BS (official page date 2025-06-28). Official JP copy: inner-center-of-gravity blade with high stability, paired with a metal-part ratchet, described as excelling at weight-based defense. Official parts-detail sheet type icon is Defense (right-spin); the sheet describes large launcher hooks and an inner-weighted structure that resists being blown away. Defense label is from that official icon / product copy. Ratchet M-85 and bit BS are added as separate rows.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx44.html","label":"Takara Tomy BX-44 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BX44.png","label":"Takara Tomy BX-44 parts-detail sheet (トリケラプレスM-85BS)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-44_manual.pdf","label":"Takara Tomy BX-44 instruction manual (PDF)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-44)","kind":"official"}]},{"id":"samurai-calibur","name":"Samurai Calibur","name_ja":"サムライカリバー","part_type":"blade","generation":"Beyblade X","product_code":"BX-45","type":"balance","notes":"Takara Tomy Basic Line blade from booster BX-45 Samurai Calibur 6-70M (official page date 2025-08-09). Official JP copy: early battle uses small blades for rapid hits plus the bit's stamina to hold defense; when it tilts late, the bit's rubber grips while large blades deliver a heavy strike; labeled a Balance Type Beyblade. Official parts-detail sheet type icon is Balance (right-spin). Balance label is from that official icon / Balance Type product copy. Ratchet 6-70 and bit M are added as separate rows. Hasbro Steel Samurai 4-80T is a different combo and is not used as a cross-ref.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx45.html","label":"Takara Tomy BX-45 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BX45.png","label":"Takara Tomy BX-45 parts-detail sheet (サムライカリバー6-70M)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-45_manual.pdf","label":"Takara Tomy BX-45 instruction manual (PDF)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-45)","kind":"official"}]},{"id":"goat-tackle","name":"Goat Tackle","name_ja":"ゴートタックル","part_type":"blade","generation":"Beyblade X","product_code":"BX-46","type":"defense","notes":"Takara Tomy Basic Line blade from set BX-46 Battle Entry Set Infinity (official page date 2025-10-11). Stock combo is ゴートタックル7-70T. Official JP copy: defends against attacks while still able to Infinity Dash; the product page labels that combo Balance Type. Official parts-detail sheet blade type icon is Defense (right-spin); the sheet describes eight downward blades that excel at blocking attacks from a low position. Defense label is from that official blade icon / blocking copy. Stock ratchet 7-70 and bit T are already in the catalog and are not duplicated.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx46.html","label":"Takara Tomy BX-46 Battle Entry Set Infinity product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BX46_02.png","label":"Takara Tomy BX-46 parts-detail sheet (ゴートタックル7-70T)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-46_manual.pdf","label":"Takara Tomy BX-46 instruction manual (PDF)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-46)","kind":"official"}]},{"id":"dran-strike","name":"Dran Strike","name_ja":"ドランストライク","part_type":"blade","generation":"Beyblade X","product_code":"BX-49","type":"attack","notes":"Takara Tomy Basic Line Expand Blade from starter BX-49 Dran Strike 4-50FF (official page date 2026-05-16). Official JP copy: Basic Line Expand Blade that joins the metal through the center for higher rigidity and stability; Winder Launcher starter. High-rigidity blade plus a low ratchet and a fast-moving bit, described as an Attack Type Beyblade that excels at delivering strong hits repeatedly. Official parts-detail sheet type icon is Attack (right-spin); the sheet describes a heavy six-blade design for intense consecutive attacks. Attack label is from that official Attack Type line / icon. Stock ratchet 4-50 is already in the catalog; bit FF is added as a separate row.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx49.html","label":"Takara Tomy BX-49 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BX49.png","label":"Takara Tomy BX-49 parts-detail sheet (ドランストライク4-50FF)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-49_manual.pdf","label":"Takara Tomy BX-49 instruction manual (PDF)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Basic Line Expand Blade)","kind":"official"}]},{"id":"ratchet-m-85","name":"M-85","name_ja":"M-85","part_type":"ratchet","generation":"Beyblade X","product_code":"BX-44","type":"unknown","notes":"Height/contact ratchet first printed in BX-44 Tricera Press M-85BS. Official parts-detail sheet names it M-85 (エムエイティーファイブ): a high-profile (height 85) ratchet with metal parts for added weight and a simple-type joint that keeps burst resistance constant. Official BX-44 product copy: metal-part ratchet used with an inner-weighted blade for weight-based defense. Ratchets are not a printed Attack/Defense/Stamina/Balance type; type left unknown. Do not confuse with Unique Line Expand lettering that also uses an M- prefix on other packs.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx44.html","label":"Takara Tomy BX-44 product page (M-85 in トリケラプレスM-85BS)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BX44.png","label":"Takara Tomy BX-44 parts-detail sheet (M-85)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-44_manual.pdf","label":"Takara Tomy BX-44 instruction manual (PDF)","kind":"official"}]},{"id":"ratchet-6-70","name":"6-70","name_ja":"6-70","part_type":"ratchet","generation":"Beyblade X","product_code":"BX-45","type":"unknown","notes":"Height/contact ratchet first printed in BX-45 Samurai Calibur 6-70M. Official parts-detail sheet names it 6-70 (シックスセブンティー): mid-height (70) ratchet with six blades arranged in two alternating types to raise parrying performance. Official pages otherwise name it as the 6-70 segment of the product name. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx45.html","label":"Takara Tomy BX-45 product page (6-70 in サムライカリバー6-70M)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BX45.png","label":"Takara Tomy BX-45 parts-detail sheet (6-70)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-45_manual.pdf","label":"Takara Tomy BX-45 instruction manual (PDF)","kind":"official"}]},{"id":"bit-rush","name":"R (Rush)","name_ja":"R（ラッシュ）","part_type":"bit","generation":"Beyblade X","product_code":"BX-20","type":"attack","notes":"Shaft-tip bit. Takara Tomy BX-20 parts-detail sheet expands R as ラッシュ (Rush): 10-tooth gear designed to increase X Dash count by slightly holding speed so dashes stay controllable. First listed on BX-20 Dran Dagger 4-60R. Official JP copy: a bit that is easy to keep dashing, for continuous X Dash. Official parts-detail sheet type icon is Attack. Attack label is from that official icon / product copy. Also used on BX-46 Cobalt Drake 9-60R. Do not confuse with Custom Line assist-blade letter R (Round).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx20.html","label":"Takara Tomy BX-20 product page (4-60R)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx20B.png","label":"Takara Tomy BX-20 parts-detail sheet (R/ラッシュ)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BX46_01.png","label":"Takara Tomy BX-46 parts-detail sheet (R/ラッシュ on 9-60R)","kind":"official"}]},{"id":"bit-high-taper","name":"HT (High Taper)","name_ja":"HT（ハイテーパー）","part_type":"bit","generation":"Beyblade X","product_code":"BX-21","type":"balance","notes":"Shaft-tip bit. Takara Tomy BX-21 parts-detail sheet expands HT as ハイテーパー (High Taper): designed 1 mm higher than Bit T. First listed on BX-21 Hells Chain 5-60HT. Official JP copy: mid-height ratchet and bit pairing for matching opponents of any height. Official parts-detail sheet type icon is Balance. Balance label is from that official icon / BX-21 Balance Type product. Hasbro English product: Chain Incendio 5-60HT (item G0196).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx21.html","label":"Takara Tomy BX-21 product page (5-60HT)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx21_p.png","label":"Takara Tomy BX-21 parts-detail sheet (HT/ハイテーパー)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-chain-incendio-5-60-ht-and-arrow-wizard-4-60-n-top-dual-pack-set-ages-8-plus/G0196","label":"Hasbro Chain Incendio 5-60HT dual pack (G0196)","kind":"official"}]},{"id":"bit-unite","name":"U (Unite)","name_ja":"U（ユナイト）","part_type":"bit","generation":"Beyblade X","product_code":"BX-33","type":"balance","notes":"Shaft-tip bit. Takara Tomy Plus One Bit campaign and the BX-33 parts-detail sheet expand U as ユナイト (Unite). First listed on booster BX-33 Weiss Tiger 3-60U. Official JP copy: a bit that can dash, counter, and evade (three movement types). Official parts-detail sheet type icon is Balance. Balance label is from that official icon / BX-33 Balance Type product. Hasbro English product: Pearl Tiger 3-60U (item G1686).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/news/news260615_6.html","label":"Takara Tomy Plus One Bit campaign (U/ユナイト)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx33.html","label":"Takara Tomy BX-33 product page (3-60U)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx33.png","label":"Takara Tomy BX-33 parts-detail sheet (U/ユナイト)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-gill-shark-4-70-o-and-pearl-tiger-3-60-u-dual-pack-set/G1686","label":"Hasbro Pearl Tiger 3-60U dual pack (G1686)","kind":"official"}]},{"id":"bit-trans-point","name":"TP (Trans Point)","name_ja":"TP（トランスポイント）","part_type":"bit","generation":"Beyblade X","product_code":"BX-38","type":"balance","notes":"Shaft-tip bit. Takara Tomy BX-38 parts-detail sheet expands TP as トランスポイント (Trans Point): a Point-type bit with a height mode-change; height changes during X Dash. First listed on booster BX-38 Crimson Garuda 4-70TP. Official JP copy: a bit whose height can be switched, for matching opponents of various heights. Official parts-detail sheet type icon is Balance with a mode-change mark. Balance label is from that official icon / BX-38 Balance Type Hasbro line. Hasbro English product: Scarlet Garuda 4-70TP (item G1673, labeled Balance Type).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx38.html","label":"Takara Tomy BX-38 product page (4-70TP)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_bx38.png","label":"Takara Tomy BX-38 parts-detail sheet (TP/トランスポイント)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-scarlet-garuda-4-70-tp-bx-starter-pack-set-with-balance-type-top-and-launcher-ages-8-plus/G1673","label":"Hasbro Scarlet Garuda 4-70TP starter (G1673)","kind":"official"}]},{"id":"bit-bound-spike","name":"BS (Bound Spike)","name_ja":"BS（バウンドスパイク）","part_type":"bit","generation":"Beyblade X","product_code":"BX-44","type":"defense","notes":"Shaft-tip bit. Takara Tomy BX-44 parts-detail sheet expands BS as バウンドスパイク (Bound Spike): pointed tip that can sink up and down against the ratchet to absorb landing impact. First listed on booster BX-44 Tricera Press M-85BS. Official parts-detail sheet type icon is Defense. Defense label is from that official icon / BX-44 Defense Type product. Also printed on UX-00 Knight Mail 3-85BS (app/event), which is a later listing of the same bit letter.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx44.html","label":"Takara Tomy BX-44 product page (M-85BS)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BX44.png","label":"Takara Tomy BX-44 parts-detail sheet (BS/バウンドスパイク)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-44_manual.pdf","label":"Takara Tomy BX-44 instruction manual (PDF)","kind":"official"}]},{"id":"bit-merge","name":"M (Merge)","name_ja":"M（マージ）","part_type":"bit","generation":"Beyblade X","product_code":"BX-45","type":"balance","notes":"Shaft-tip bit. Takara Tomy BX-45 parts-detail sheet expands M as マージ (Merge): high-friction rubber tip with a pointed center and jagged surround, described as balancing grip and stamina. First listed on booster BX-45 Samurai Calibur 6-70M. Official JP copy: the bit's stamina holds defense early, then rubber grips when the Bey tilts late. Official parts-detail sheet type icon is Balance. Balance label is from that official icon / BX-45 Balance Type product. Also printed later on BX-00 Storm Spriggan 2-70M.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx45.html","label":"Takara Tomy BX-45 product page (6-70M)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BX45.png","label":"Takara Tomy BX-45 parts-detail sheet (M/マージ)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-45_manual.pdf","label":"Takara Tomy BX-45 instruction manual (PDF)","kind":"official"}]},{"id":"bit-free-flat","name":"FF (Free Flat)","name_ja":"FF（フリーフラット）","part_type":"bit","generation":"Beyblade X","product_code":"BX-49","type":"attack","notes":"Shaft-tip bit. Takara Tomy BX-49 parts-detail sheet expands FF as フリーフラット (Free Flat): rotates freely against the ratchet; slightly narrow flat tip balances reduced stamina loss with dash speed. First listed on starter BX-49 Dran Strike 4-50FF. Official JP copy: a fast-moving bit used with a low ratchet for repeated strong attacks. Official parts-detail sheet type icon is Attack. Attack label is from that official icon / BX-49 Attack Type product.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx49.html","label":"Takara Tomy BX-49 product page (4-50FF)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/_image/detail_BX49.png","label":"Takara Tomy BX-49 parts-detail sheet (FF/フリーフラット)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-49_manual.pdf","label":"Takara Tomy BX-49 instruction manual (PDF)","kind":"official"}]}];

    const PART_TYPES = ["all", "blade", "ratchet", "bit", "lock_chip", "other"];
    const BATTLE_TYPES = ["all", "attack", "defense", "stamina", "balance", "unknown"];

    const labelPart = {
      all: "All parts",
      blade: "Blade",
      ratchet: "Ratchet",
      bit: "Bit",
      lock_chip: "Lock chip",
      other: "Other",
    };

    const labelType = {
      all: "Any type",
      attack: "Attack",
      defense: "Defense",
      stamina: "Stamina",
      balance: "Balance",
      unknown: "Unknown",
    };

    const state = {
      q: "",
      partType: "all",
      battleType: "all",
    };

    const listEl = document.getElementById("list");
    const countEl = document.getElementById("count");
    const qEl = document.getElementById("q");
    const partFiltersEl = document.getElementById("part-type-filters");
    const typeFiltersEl = document.getElementById("type-filters");

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function matches(part) {
      if (state.partType !== "all" && part.part_type !== state.partType) return false;
      if (state.battleType !== "all" && part.type !== state.battleType) return false;
      if (!state.q) return true;
      const hay = [
        part.id,
        part.name,
        part.name_ja,
        part.product_code,
        part.part_type,
        part.type,
        part.notes,
        ...(part.sources || []).flatMap((s) => [s.label, s.url]),
      ]
        .join("\n")
        .toLowerCase();
      return hay.includes(state.q);
    }

    function renderFilters(container, keys, labels, current, onPick) {
      container.innerHTML = "";
      for (const key of keys) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = labels[key];
        btn.setAttribute("aria-pressed", key === current ? "true" : "false");
        btn.addEventListener("click", () => onPick(key));
        container.appendChild(btn);
      }
    }

    function render() {
      renderFilters(partFiltersEl, PART_TYPES, labelPart, state.partType, (key) => {
        state.partType = key;
        render();
      });
      renderFilters(typeFiltersEl, BATTLE_TYPES, labelType, state.battleType, (key) => {
        state.battleType = key;
        render();
      });

      const filtered = PARTS.filter(matches);
      countEl.textContent = `${filtered.length} / ${PARTS.length}`;

      if (!filtered.length) {
        listEl.innerHTML = `<p class="empty">No parts match those filters.</p>`;
        return;
      }

      listEl.innerHTML = filtered
        .map((part) => {
          const sources = (part.sources || [])
            .map(
              (s) =>
                `<li><a href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(
                  s.label || s.url
                )}</a></li>`
            )
            .join("");
          return `
            <details class="part" id="${escapeHtml(part.id)}">
              <summary>
                <div class="part-title">
                  <h2>${escapeHtml(part.name)}</h2>
                  <div class="ja">${escapeHtml(part.name_ja)}</div>
                </div>
                <div class="badges">
                  <span>${escapeHtml(labelPart[part.part_type] || part.part_type)}</span>
                  <span>${escapeHtml(labelType[part.type] || part.type)}</span>
                  <span class="code">${escapeHtml(part.product_code)}</span>
                </div>
              </summary>
              <div class="detail">
                <dl>
                  <dt>Id</dt><dd><code>${escapeHtml(part.id)}</code></dd>
                  <dt>Generation</dt><dd>${escapeHtml(part.generation)}</dd>
                </dl>
                <p>${escapeHtml(part.notes)}</p>
                <ul class="sources">${sources}</ul>
              </div>
            </details>
          `;
        })
        .join("");
    }

    let searchTimer = 0;
    qEl.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.q = qEl.value.trim().toLowerCase();
        render();
      }, 80);
    });

    render();

    if (location.hash) {
      const target = document.getElementById(location.hash.slice(1));
      if (target) {
        target.open = true;
        target.scrollIntoView({ block: "start" });
      }
    }
  </script>
</body>
