<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beyblade X · Parts encyclopedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1c1f;
      --muted: #5c6370;
      --paper: #f3f0ea;
      --paper-2: #e8e3da;
      --rail: #0e7c7b;
      --rail-bright: #19b5b3;
      --burst: #d62828;
      --line: rgba(26, 28, 31, 0.12);
      --shadow: 0 18px 50px rgba(26, 28, 31, 0.08);
      --font-display: "Anybody", "Arial Narrow", sans-serif;
      --font-body: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(25, 181, 179, 0.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(214, 40, 40, 0.12), transparent 50%),
        linear-gradient(165deg, var(--paper) 0%, var(--paper-2) 100%);
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(115deg, transparent 0 46%, rgba(14, 124, 123, 0.07) 46% 54%, transparent 54%),
        linear-gradient(-115deg, transparent 0 46%, rgba(214, 40, 40, 0.05) 46% 54%, transparent 54%);
      opacity: 0.9;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    header.hero {
      display: grid;
      gap: 1rem;
      padding: 1.25rem 0 1.75rem;
      border-bottom: 1px solid var(--line);
      animation: rise 0.7s ease-out both;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.6rem, 8vw, 4.4rem);
      line-height: 0.92;
      letter-spacing: -0.03em;
      margin: 0;
      text-transform: uppercase;
    }

    .brand span {
      color: var(--burst);
    }

    .lede {
      margin: 0;
      max-width: 36rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      gap: 0.85rem;
      margin-top: 1.5rem;
      animation: rise 0.8s 0.08s ease-out both;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
      align-items: center;
    }

    input[type="search"] {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(6px);
      border-radius: 0;
      padding: 0.85rem 1rem;
      font: 500 1rem/1.2 var(--font-body);
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="search"]:focus {
      border-color: var(--rail);
      box-shadow: 0 0 0 3px rgba(14, 124, 123, 0.18);
    }

    .meta {
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .filters button {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font: 600 0.85rem/1 var(--font-body);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .filters button:hover {
      border-color: var(--rail);
      transform: translateY(-1px);
    }

    .filters button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .type-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .type-filters button {
      appearance: none;
      border: none;
      background: none;
      color: var(--muted);
      font: 500 0.9rem/1.2 var(--font-body);
      padding: 0.35rem 0.45rem;
      cursor: pointer;
      text-decoration: underline transparent;
      text-underline-offset: 0.2em;
      transition: color 0.15s ease, text-decoration-color 0.15s ease;
    }

    .type-filters button:hover,
    .type-filters button[aria-pressed="true"] {
      color: var(--burst);
      text-decoration-color: currentColor;
    }

    main {
      margin-top: 1.75rem;
      display: grid;
      gap: 0.65rem;
      animation: rise 0.85s 0.14s ease-out both;
    }

    .part {
      border-top: 1px solid var(--line);
      padding: 0.15rem 0;
    }

    .part:last-child {
      border-bottom: 1px solid var(--line);
    }

    .part summary {
      list-style: none;
      cursor: pointer;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem 1rem;
      align-items: baseline;
      padding: 0.95rem 0.15rem;
      transition: background 0.2s ease;
    }

    .part summary::-webkit-details-marker { display: none; }

    .part summary:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .part[open] summary {
      background: rgba(255, 255, 255, 0.55);
    }

    .part-title {
      display: grid;
      gap: 0.2rem;
      min-width: 0;
    }

    .part-title h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 3vw, 1.65rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .part-title .ja {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.75rem;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badges .code {
      color: var(--rail);
    }

    .detail {
      padding: 0 0.15rem 1.2rem;
      display: grid;
      gap: 0.85rem;
      max-width: 46rem;
      animation: open 0.28s ease-out;
    }

    .detail p {
      margin: 0;
      line-height: 1.55;
      color: var(--ink);
    }

    .detail dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.35rem 1rem;
      margin: 0;
      font-size: 0.95rem;
    }

    .detail dt {
      color: var(--muted);
      font-weight: 600;
    }

    .detail dd {
      margin: 0;
    }

    .sources {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.4rem;
    }

    .sources a {
      color: var(--rail);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid rgba(14, 124, 123, 0.35);
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .sources a:hover {
      color: var(--burst);
      border-color: rgba(214, 40, 40, 0.45);
    }

    .empty {
      padding: 2.5rem 0.15rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }

    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
    }

    footer code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.84em;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes open {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .search-row {
        grid-template-columns: 1fr;
      }
      .part summary {
        grid-template-columns: 1fr;
      }
      .badges {
        justify-content: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

  </div>

  <script>
    const PARTS = [{"id":"dran-sword","name":"Dran Sword","name_ja":"ドランソード","part_type":"blade","generation":"Beyblade X","product_code":"BX-01","type":"attack","notes":"Takara Tomy Basic Line blade from starter BX-01 Dran Sword 3-60F (released 2023-07-15). Official JP copy: high-attack blade paired with a dash-oriented bit for a powerful X Dash. Takara Tomy Asia Start Dash Guide: three uppercut blades, 'excellent at flipping the opponent's Bey diagonally upwards.' Hasbro English product name: Sword Dran (item F9580, labeled Attack Type). Stock combo type is set by the Bit (official guide); this attack label is from the BX-01 / Hasbro Attack Type product.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx01.html","label":"Takara Tomy BX-01 product page","kind":"official"},{"url":"https://takaratomyasia.com/documents/beybladex/1705650582_Beyblade%20X_Start%20Dash%20Guide.pdf","label":"Takara Tomy Asia Start Dash Guide (DRANSWORD)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-sword-dran-3-60-f-starter-pack-set-with-attack-type-top-and-launcher-ages-8-plus/F9580","label":"Hasbro Sword Dran 3-60F starter (F9580)","kind":"official"}]},{"id":"hells-scythe","name":"Hells Scythe","name_ja":"ヘルズサイズ","part_type":"blade","generation":"Beyblade X","product_code":"BX-02","type":"balance","notes":"Takara Tomy Basic Line blade from starter BX-02 Hells Scythe 4-60T (released 2023-07-15). Official JP copy: parts combined for attack/defense balance and broader matchup coverage. Start Dash Guide: four blades, 'excellent at breaking the opponent's Bey'; combo labeled Balance Type. Hasbro English product name: Scythe Incendio (item F9583, labeled Balance Type).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx02.html","label":"Takara Tomy BX-02 product page","kind":"official"},{"url":"https://takaratomyasia.com/documents/beybladex/1705650582_Beyblade%20X_Start%20Dash%20Guide.pdf","label":"Takara Tomy Asia Start Dash Guide (HELLSSCYTHE)","kind":"official"},{"url":"https://shop.hasbro.com/en-ca/product/beyblade-x-scythe-incendio-4-60-t-starter-pack-set-with-balance-type-top-and-launcher-ages-8-plus/F9583","label":"Hasbro Scythe Incendio 4-60T starter (F9583)","kind":"official"}]},{"id":"wizard-arrow","name":"Wizard Arrow","name_ja":"ウィザードアロー","part_type":"blade","generation":"Beyblade X","product_code":"BX-03","type":"stamina","notes":"Takara Tomy Basic Line blade from starter BX-03 Wizard Arrow 4-80B (released 2023-07-15). Official JP copy: blade that generates strong centrifugal force; combo described as excelling at long spin. Start Dash Guide: outer center of gravity with two large circular blades; combo labeled Stamina Type. Also sold as booster BX-05. Hasbro English product name: Arrow Wizard (item F9582, labeled Stamina Type).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx03.html","label":"Takara Tomy BX-03 product page","kind":"official"},{"url":"https://takaratomyasia.com/documents/beybladex/1705650582_Beyblade%20X_Start%20Dash%20Guide.pdf","label":"Takara Tomy Asia Start Dash Guide (WIZARDARROW)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-arrow-wizard-4-80-b-starter-pack-set-with-stamina-type-top-and-launcher-ages-8-plus/F9582","label":"Hasbro Arrow Wizard 4-80B starter (F9582)","kind":"official"}]},{"id":"knight-shield","name":"Knight Shield","name_ja":"ナイトシールド","part_type":"blade","generation":"Beyblade X","product_code":"BX-04","type":"defense","notes":"Takara Tomy Basic Line blade from starter BX-04 Knight Shield 3-80N (released 2023-07-15). Official JP copy: impact-absorbing blade. Start Dash Guide: damper structure with six pieces of protection; combo labeled Defensive Type. Also sold as booster BX-06. Hasbro English product name: Helm Knight (item F9581, labeled Defense Type).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx04.html","label":"Takara Tomy BX-04 product page","kind":"official"},{"url":"https://takaratomyasia.com/documents/beybladex/1705650582_Beyblade%20X_Start%20Dash%20Guide.pdf","label":"Takara Tomy Asia Start Dash Guide (KNIGHTSHIELD)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-helm-knight-3-80-n-starter-pack-set-with-defense-type-top-and-launcher-ages-8-plus/F9581","label":"Hasbro Helm Knight 3-80N starter (F9581)","kind":"official"}]},{"id":"knight-lance","name":"Knight Lance","name_ja":"ナイトランス","part_type":"blade","generation":"Beyblade X","product_code":"BX-13","type":"unknown","notes":"Takara Tomy Basic Line blade from booster BX-13 Knight Lance 4-80HN (released 2023-08-10). Official JP copy: high-positioned blades paired with a tall bit, specialized for counter performance. Official pages do not print Attack/Defense/Stamina/Balance on this blade alone; type left unknown. Listed in the Takara Tomy Asia Start Dash Guide lineup as BX-13 BOOSTER KNIGHT LANCE 4-80HN.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx13.html","label":"Takara Tomy BX-13 product page","kind":"official"},{"url":"https://takaratomyasia.com/documents/beybladex/1705650582_Beyblade%20X_Start%20Dash%20Guide.pdf","label":"Takara Tomy Asia Start Dash Guide lineup (KNIGHT LANCE)","kind":"official"}]},{"id":"leon-claw","name":"Leon Claw","name_ja":"レオンクロー","part_type":"blade","generation":"Beyblade X","product_code":"BX-15","type":"unknown","notes":"Takara Tomy Basic Line blade from starter BX-15 Leon Claw 5-60P (released 2023-10-07). Official JP copy: blade with both attack and defense blades; stock bit can change movement depending on how you shoot. Cited pages do not print a single Attack/Defense/Stamina/Balance label for the blade; type left unknown. Hasbro English product name: Claw Leon (item G0193).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx15.html","label":"Takara Tomy BX-15 product page","kind":"official"},{"url":"https://takaratomyasia.com/documents/beybladex/1705650582_Beyblade%20X_Start%20Dash%20Guide.pdf","label":"Takara Tomy Asia Start Dash Guide lineup (LEON CLAW)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-claw-leon-5-60-p-starter-pack-top-and-launcher/G0193","label":"Hasbro Claw Leon 5-60P starter (G0193)","kind":"official"}]},{"id":"rhino-horn","name":"Rhino Horn","name_ja":"ライノホーン","part_type":"blade","generation":"Beyblade X","product_code":"BX-19","type":"defense","notes":"Takara Tomy Basic Line blade from booster BX-19 Rhino Horn 3-80S (released 2023-11-02). Official JP copy: small-diameter inward-weighted (inner-center-of-gravity) blade; stock combo described as staying near stadium center and repelling attacks from all directions. Defense label is from that official product description, not a printed Hasbro type line.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx19.html","label":"Takara Tomy BX-19 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-19)","kind":"official"}]},{"id":"phoenix-wing","name":"Phoenix Wing","name_ja":"フェニックスウイング","part_type":"blade","generation":"Beyblade X","product_code":"BX-23","type":"attack","notes":"Takara Tomy Basic Line blade from starter BX-23 Phoenix Wing 9-60GF (released 2023-12-27). Official JP copy: painted metal three-blade design that strongly knocks the opponent away; paired with a gear-shaped bit tip for a heavy X Dash. Official BX-23 manual lists blade 【フェニックスウイング メタルコート：レッド】 and bit 【GF】. Attack label is from that knock-away / X Dash product copy, not a separate printed type badge.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx23.html","label":"Takara Tomy BX-23 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BX-23_manual.pdf","label":"Takara Tomy BX-23 instruction manual (PDF)","kind":"official"}]},{"id":"unicorn-sting","name":" uide (Ratchet 4-80)","kind":"official"}]},{"id":"ratchet-3-80","name":"3-80","name_ja":"3-80","part_type":"ratchet","generation":"Beyblade X","product_code":"BX-04","type":"unknown","notes":"Height/contact ratchet from BX-04 Knight Shield 3-80N. Start Dash Guide: 'The part that set the Bey high. Adopts 3 blades with high repelling performance.' Also used on BX-19 Rhino Horn 3-80S. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx04.html","label":"Takara Tomy BX-04 product page (3-80 in product name)","kind":"official"},{"url":"https://takaratomyasia.com/documents/beybladex/1705650582_Beyblade%20X_Start%20Dash%20Guide.pdf","label":"Takara Tomy Asia Start Dash Guide (Ratchet 3-80)","kind":"official"}]},{"id":"ratchet-5-60","name":"5-60","name_ja":"5-60","part_type":"ratchet","generation":"Beyblade X","product_code":"BX-15","type":"unknown","notes":"Height/contact ratchet printed in starter BX-15 Leon Claw 5-60P and booster BX-26 Unicorn Sting 5-60GP. Official pages name the ratchet only as the 5-60 segment of the product code; no printed Attack/Defense/Stamina/Balance type. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx15.html","label":"Takara Tomy BX-15 product page (5-60 in product name)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx26.html","label":"Takara Tomy BX-26 product page (5-60 in product name)","kind":"official"}]},{"id":"ratchet-9-60","name":"9-60","name_ja":"9-60","part_type":"ratchet","generation":"Beyblade X","product_code":"BX-23","type":"unknown","notes":"Height/contact ratchet printed in starter BX-23 Phoenix Wing 9-60GF. Official pages name it only as the 9-60 segment of the product code. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx23.html","label":"Takara Tomy BX-23 product page (9-60 in product name)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/m :"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx04.html","label":"Takara Tomy BX-04 product page (center-holding bit)","kind":"official"}]},{"id":"bit-point","name":"P (Point)","name_ja":"P（ポイント）","part_type":"bit","generation":"Beyblade X","product_code":"BX-15","type":"unknown","notes":"Shaft-tip bit. Takara Tomy campaign page names it P/ポイント (Point). BX-15 JP copy: bit whose movement can change depending on how you shoot. No Attack/Defense/Stamina/Balance print found on the cited pages; type left unknown. Do not confuse with lock-chip or assist-blade letters that also use P.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/news/news251015_3.html","label":"Takara Tomy Plus One Bit campaign (P/ポイント)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx15.html","label":"Takara Tomy BX-15 product page (5-60P)","kind":"official"}]},{"id":"lock-chip-dran","name":"Dran","name_ja":"ドラン","part_type":"lock_chip","generation":"Beyblade X","product_code":"CX-01","type":"unknown","notes":"Custom Line lock chip. Takara Tomy Gear Structure: Custom Line blades disassemble into lock chip, main blade, and assist blade. Official CX CUP parts list names ドラン as a lock chip. First listed on starter CX-01 Dran Brave S6-60V (lock chip Dran + main blade Brave + assist blade S/Slash + ratchet 6-60 + bit V). Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/event/g2_cxcup2026_list.html","label":"Takara Tomy CX CUP legal parts list (lock chip ドラン)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx01.html","label":"Takara Tomy CX-01 product page (ドランブレイブS6-60V)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Custom Line lock chip)","kind":"official"}]},{"id":"lock-chip-wizard","name":"Wizard","name_ja":"ウィザード","part_type":"lock_chip","generation":"Beyblade X","product_code":"CX-02","type":"unknown","notes":"Custom Lin l":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx27.html","label":"Takara Tomy BX-27 Sphinx Cowl Select","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-27 ランダムブースター)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-cowl-sphinx-9-80-gn-booster-pack-set/G1530","label":"Hasbro Cowl Sphinx 9-80GN booster (G1530)","kind":"official"}]},{"id":"tyranno-beat","name":"Tyranno Beat","name_ja":"ティラノビート","part_type":"blade","generation":"Beyblade X","product_code":"BX-31","type":"unknown","notes":"Takara Tomy Basic Line blade; prize Bey of random booster BX-31 Vol.3 (released 2024-04-27). Official JP copy: rare is ティラノビート4-70Q; a diagonally cut bouncing bit plus a thick serrated eight-blade lets the Bey move irregularly around the stadium for unpredictable hits. Cited pages do not print Attack/Defense/Stamina/Balance on the blade alone; type left unknown. Hasbro English product name on shop slug: Beat Tyranno (item G1542 dual pack).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx31.html","label":"Takara Tomy BX-31 Random Booster Vol.3","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-31 ランダムブースター)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-beat-tyranno-4-70-q-and-knife-shinobi-4-80-hn-dual-pack-set/G1542","label":"Hasbro Beat Tyranno 4-70Q dual pack (G1542)","kind":"official"}]},{"id":"shinobi-shadow","name":"Shinobi Shadow","name_ja":"シノビシャドウ","part_type":"blade","generation":"Beyblade X","product_code":"UX-05","type":"unknown","notes":"Takara Tomy Unique Line blade from random booster UX-05 Shinobi Shadow Select (released 2024-05-18). Official JP copy: Unique Line puts more blade metal on the outer rim; all three slots use new blade シノビシャドウ; featured combo シノビシャドウ1-80MN pairs a smooth-shaped blade with a metal-tipped high-stability bit, specialized for slipping attacks. Cited pages do not print Attack/Defense/Stamina/Balance; type left unknown. Hasbro English product name on shop slug: Shadow Shinobi 1-80MN (item G1751).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux05.html","label":"Takara Tomy UX-05 Shinobi Shadow Select","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Unique Line)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-shadow-shinobi-1-80-mn-ux-starter-pack-top-and-launcher/G1751","label":"Hasbro Shadow Shinobi 1-80MN UX starter (G1751)","kind":"official"}]},{"id":"black-shell","name":"Black Shell","name_ja":"ブラックシェル","part_type":"blade","generation":"Beyblade X","product_code":"BX-35","type":"defense","notes":"Takara Tomy Basic Line blade; prize Bey of random booster BX-35 Vol.4 (released 2024-07-13). Official JP copy: rare is ブラックシェル4-60D; downward defensive blades plus a low ratchet and a hard-to-push-out bit, described as excelling at enduring low-position attacks. Defense label is from that official combo description. Hasbro English product name on shop slug: Obsidian Shell 4-60D (item G1533).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx35.html","label":"Takara Tomy BX-35 Random Booster Vol.4","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-35 ランダムブースター)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-obsidian-shell-4-60-d-booster-pack-set/G1533","label":"Hasbro Obsidian Shell 4-60D booster (G1533)","kind":"official"}]},{"id":"lightning-l-drago","name":"Lightning L-Drago","name_ja":"ライトニングエルドラゴ","part_type":"blade","generation":"Beyblade X","product_code":"BX-00","type":"attack","notes":"Takara Tomy Basic Line left-spin blade from BX-00 random booster Lightning L-Drago 1-60F (released 2024-09-14). Official JP copy: Metal Fight Beyblade Lightning L-Drago in Beyblade X form; pack contains one of two variants — Upper type (strong upper-attack) or Rush type (rush blades in three places). Left-spin blade with high-attack parts, described as strong against right-spin opponents; needs a left-spin launcher. Attack label is from that official product description. Bit F in the product name is the existing Flat bit, not duplicated here.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx00-ld.html","label":"Takara Tomy BX-00 Lightning L-Drago 1-60F random booster","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/BXG-07_manual.pdf","label":"Takara Tomy BXG-07 / BX-00 Lightning L-Drago manual (PDF)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-00 ランダムブースター ライトニングエルドラゴ)","kind":"official"}]},{"id":"whale-wave","name":"Whale Wave","name_ja":"ホエールウェーブ","part_type":"blade","generation":"Beyblade X","product_code":"BX-36","type":"unknown","notes":"Takara Tomy Basic Line blade from random booster BX-36 Whale Wave Select (released 2024-09-14). Official JP copy: all three slots use new blade ホエールウェーブ; featured combo ホエールウェーブ5-80E pairs a smash-oriented blade with a guided bit whose tip lifts during X Dash, described as good at slamming the opponent from above. Cited pages do not print Attack/Defense/Stamina/Balance on the blade alone; type left unknown. Hasbro English product name on shop slug: Tide Whale 5-80E (item G1669).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx36.html","label":"Takara Tomy BX-36 Whale Wave Select","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-36 ランダムブースター)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-tide-whale-5-80-e-booster-pack-set/G1669","label":"Hasbro Tide Whale 5-80E booster (G1669)","kind":"official"}]},{"id":"ghost-circle","name":"Ghost Circle","name_ja":"ゴーストサークル","part_type":"blade","generation":"Beyblade X","product_code":"UX-12","type":"unknown","notes":"Takara Tomy Unique Line blade; prize Bey of random booster UX-12 Vol.5 (official page date 2024-12-28). Official JP copy: rare is ゴーストサークル0-80GB; small-diameter 0-blade plus matching ratchet reduces stamina loss from hits, specialized for spinning a long time regardless of opponent type. Cited pages do not print Attack/Defense/Stamina/Balance on the blade alone; type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux12.html","label":"Takara Tomy UX-12 Random Booster Vol.5","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-12 ランダムブースター)","kind":"official"}]},{"id":"shelter-drake","name":"Shelter Drake","name_ja":"シェルタードレイク","part_type":"blade","generation":"Beyblade X","product_code":"BX-39","type":"balance","notes":"Takara Tomy Basic Line blade from random booster BX-39 Shelter Drake Select (official page date 2025-02-15). Official JP copy: all three slots use new blade シェルタードレイク; featured combo シェルタードレイク7-80GP combines slip-away defense with high-centrifugal stamina and is labeled a Balance Type Beyblade. Balance label is from that official product description.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx39.html","label":"Takara Tomy BX-39 Shelter Drake Select","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-39 ランダムブースター)","kind":"official"}]},{"id":"clock-mirage","name":"Clock Mirage","name_ja":"クロックミラージュ","part_type":"blade","generation":"Beyblade X","product_code":"UX-16","type":"unknown","notes":"Takara Tomy Unique Line blade from random booster UX-16 Clock Mirage Select (official page date 2025-10-11). Official JP copy: one of three colors of クロックミラージュ9-65B; circular 60-blade plus a low ratchet and high-stamina bit, specialized for long spin. Official note: blade クロックミラージュ can only be attached to simple-type ratchets. Cited pages do not print Attack/Defense/Stamina/Balance on the blade alone; type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux16.html","label":"Takara Tomy UX-16 Clock Mirage Select","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-16 ランダムブースター)","kind":"official"}]},{"id":"heavens-ring","name":"Heavens Ring","name_ja":"ヘブンズリング","part_type":"blade","generation":"Beyblade X","product_code":"BX-50","type":"defense","notes":"Takara Tomy Basic Line Expand Blade; prize Bey of random booster BX-50 Vol.11 (official page date 2026-07-11). Official JP copy: rare is ヘブンズリング0-80DS; Basic Line Expand Blade joins the blade metal at the center for higher rigidity/stability. Circular impact-dispersing blade plus a bit that holds posture at stadium center, described as a Defense Type Beyblade that can take hits from any direction. Defense label is from that official product description.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx50.html","label":"Takara Tomy BX-50 Random Booster Vol.11","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Basic Line Expand Blade)","kind":"official"}]},{"id":"unicorn-delta","name":"Unicorn Delta","name_ja":"ユニコーンデルタ","part_type":"blade","generation":"Beyblade X","product_code":"CX-17","type":"balance","notes":"Takara Tomy Custom Line over-blade; prize Bey of random booster CX-17 Vol.10 (official page date 2026-04-25). Official JP copy: rare is ユニコーンデルタPO3-60GU; assembling the over-blade in different orientations switches Attack / Balance / Defense styles, described as a Balance Type Beyblade that can cover many matchups. Balance label is from that official product description. PO / GU letters are printed in the prize product name; cited pages do not expand those abbreviations, so they are not invented here.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx17.html","label":"Takara Tomy CX-17 Random Booster Vol.10","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Custom Line / Expand Blade)","kind":"official"}]},{"id":"ratchet-5-80","name":"5-80","name_ja":"5-80","part_type":"ratchet","generation":"Beyblade X","product_code":"BX-16","type":"unknown","notes":"Height/contact ratchet printed in random-booster featured combos BX-16 Viper Tail 5-80O and BX-24 Wyvern Gale 5-80GB. Official pages name it only as the 5-80 segment of those product names. Ratchets are not a printed Attack/Defense/Stamina/Balance type; type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx16.html","label":"Takara Tomy BX-16 product page (5-80 in ヴァイパーテイル5-80O)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx24.html","label":"Takara Tomy BX-24 product page (5-80 in ワイバーンゲイル5-80GB)","kind":"official"}]},{"id":"ratchet-9-80","name":"9-80","name_ja":"9-80","part_type":"ratchet","generation":"Beyblade X","product_code":"BX-27","type":"unknown","notes":"Height/contact ratchet printed in random-booster featured combo BX-27 Sphinx Cowl 9-80GN. Official JP copy pairs the nine-blade rush blade with this ratchet. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx27.html","label":"Takara Tomy BX-27 product page (9-80 in スフィンクスカウル9-80GN)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Ratchet role)","kind":"official"}]},{"id":"ratchet-4-70","name":"4-70","name_ja":"4-70","part_type":"ratchet","generation":"Beyblade X","product_code":"BX-31","type":"unknown","notes":"Height/contact ratchet printed in random-booster prize combo BX-31 Tyranno Beat 4-70Q. Official pages name it only as the 4-70 segment of the product name. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx31.html","label":"Takara Tomy BX-31 product page (4-70 in ティラノビート4-70Q)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (BX-31)","kind":"official"}]},{"id":"ratchet-1-80","name":"1-80","name_ja":"1-80","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-05","type":"unknown","notes":"Height/contact ratchet printed in random-booster featured combo UX-05 Shinobi Shadow 1-80MN. Official pages name it only as the 1-80 segment of the product name. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux05.html","label":"Takara Tomy UX-05 product page (1-80 in シノビシャドウ1-80MN)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-05)","kind":"official"}]},{"id":"ratchet-0-80","name":"0-80","name_ja":"0-80","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-12","type":"unknown","notes":"Height/contact ratchet printed in random-booster prize combos UX-12 Ghost Circle 0-80GB and BX-50 Heavens Ring 0-80DS. UX-12 JP copy describes the 0-blade plus this ratchet as reducing stamina loss from hits. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux12.html","label":"Takara Tomy UX-12 product page (0-80 in ゴーストサークル0-80GB)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx50.html","label":"Takara Tomy BX-50 product page (0-80 in ヘブンズリング0-80DS)","kind":"official"}]},{"id":"bit-gear-ball","name":"GB (Gear Ball)","name_ja":"GB（ギヤボール）","part_type":"bit","generation":"Beyblade X","product_code":"BX-24","type":"unknown","notes":"Shaft-tip bit. Takara Tomy Plus One Bit campaign expands GB as ギヤボール (Gear Ball). First listed on random-booster prize BX-24 Wyvern Gale 5-80GB; BX-24 JP copy describes a large spherical bit tip that can counter while holding posture. Also used on UX-12 Ghost Circle 0-80GB. Cited pages do not print Attack/Defense/Stamina/Balance for GB; type left unknown. Do not confuse with assist-blade letter G.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/news/news260615_6.html","label":"Takara Tomy Plus One Bit campaign (GB/ギヤボール)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/bx24.html","label":"Takara Tomy BX-24 product page (5-80GB)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux12.html","label":"Takara Tomy UX-12 product page (0-80GB)","kind":"official"}]},{"id":"lock-chip-hells","name":"Hells","name_ja":"ヘルズ","part_type":"lock_chip","generation":"Beyblade X","product_code":"CX-05","type":"unknown","notes":"Custom Line lock chip named ヘルズ on the official CX CUP parts list. First listed on random-booster prize CX-05 Hells Reaper T 4-70K (ヘルズリーパーT4-70K). Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/event/g2_cxcup2026_list.html","label":"Takara Tomy CX CUP legal parts list (lock chip ヘルズ)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx05.html","label":"Takara Tomy CX-05 Random Booster Vol.6 (ヘルズリーパーT4-70K)","kind":"official"}]},{"id":"lock-chip-fox","name":"Fox","name_ja":"フォックス","part_type":"lock_chip","generation":"Beyblade X","product_code":"CX-06","type":"unknown","notes":"Custom Line lock chip named フォックス on the official CX CUP parts list. First listed on random booster CX-06 Fox Brush Select; official JP copy names new blade フォックスブラッシュJ and featured combo フォックスブラッシュJ9-70GR. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/event/g2_cxcup2026_list.html","label":"Takara Tomy CX CUP legal parts list (lock chip フォックス)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx06.html","label":"Takara Tomy CX-06 Fox Brush Select","kind":"official"}]},{"id":"lock-chip-cerberus","name":"Cerberus","name_ja":"ケルベロス","part_type":"lock_chip","generation":"Beyblade X","product_code":"CX-08","type":"unknown","notes":"Custom Line lock chip named ケルベロス on the official CX CUP parts list. First listed on random-booster prize CX-08 Cerberus Flame W 5-80WB (ケルベロスフレイムW5-80WB). Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/event/g2_cxcup2026_list.html","label":"Takara Tomy CX CUP legal parts list (lock chip ケルベロス)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx08.html","label":"Takara Tomy CX-08 Random Booster Vol.7 (ケルベロスフレイムW5-80WB)","kind":"official"}]},{"id":"assist-blade-turn","name":"T (Turn)","name_ja":"T（ターン）","part_type":"other","generation":"Beyblade X","product_code":"CX-05","type":"unknown","notes":"Custom Line assist blade (not a lock chip). Official CX CUP parts list expands T as ターン (Turn) under アシストブレード. Appears as the T in random-booster prize CX-05 Hells Reaper T 4-70K. Type left unknown. Do not confuse with bit T (Taper).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/event/g2_cxcup2026_list.html","label":"Takara Tomy CX CUP legal parts list (assist blade T/Turn)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx05.html","label":"Takara Tomy CX-05 product page (T in ヘルズリーパーT4-70K)","kind":"official"}]},{"id":"leon-crest","name":"Leon Crest","name_ja":"レオンクレスト","part_type":"blade","generation":"Beyblade X","product_code":"UX-06","type":"defense","notes":"Takara Tomy Unique Line blade from booster UX-06 Leon Crest 7-60GN (released 2024-08-10). Official JP copy: Unique Line puts more blade metal on the outer rim; wall-like blade and ratchet specialized for repelling attacks from any direction. Defense label is from that official product description. Hasbro English product name on shop slug: Crest Leon 7-60GN (item G1685 dual pack with Cowl Sphinx).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux06.html","label":"Takara Tomy UX-06 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Unique Line / UX-06)","kind":"official"},{"url":"https://shop.hasbro.com/en-ca/product/beyblade-x-cowl-sphinx-1-80-gf-and-crest-leon-7-60-gn-dual-pack-set/G1685","label":"Hasbro Cowl Sphinx & Crest Leon dual pack (G1685)","kind":"official"}]},{"id":"phoenix-rudder","name":"Phoenix Rudder","name_ja":"フェニックスラダー","part_type":"blade","generation":"Beyblade X","product_code":"UX-07","type":"stamina","notes":"Takara Tomy Unique Line blade from set UX-07 Phoenix Rudder Deck Set (released 2024-08-10). Official JP copy: Unique Line puts more blade metal on the outer rim; the set is three pre-customized special-color Beys covering stamina, defense, and attack. Featured combo フェニックスラダー9-70G pairs an inverted-trapezoid blade with a low-friction bit so the Bey can take the opponent's stamina while keeping its own spin. Stamina label is from that official featured-combo description, not a separate printed type badge.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux07.html","label":"Takara Tomy UX-07 Phoenix Rudder Deck Set","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-07)","kind":"official"}]},{"id":"silver-wolf","name":"Silver Wolf","name_ja":"シルバーウルフ","part_type":"blade","generation":"Beyblade X","product_code":"UX-08","type":"stamina","notes":"Takara Tomy Unique Line blade from starter UX-08 Silver Wolf 3-80FB (released 2024-10-12). Official JP copy: Unique Line puts more blade metal on the outer rim; free-spin blade gimmick sheds opponent attacks while a free-spin bit helps keep stamina, specialized for reducing stamina loss. Hasbro English product name on shop slug: Sterling Wolf 3-80FB (item G1674, labeled Stamina Type). Stamina label is from that official / Hasbro Stamina Type product copy.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux08.html","label":"Takara Tomy UX-08 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-08)","kind":"official"},{"url":"https://shop.hasbro.com/en-us/product/beyblade-x-sterling-wolf-3-80-fb-ux-starter-pack-set-with-stamina-type-top-and-launcher-ages-8-plus/G1674","label":"Hasbro Sterling Wolf 3-80FB UX starter (G1674)","kind":"official"}]},{"id":"samurai-saber","name":"Samurai Saber","name_ja":"サムライセイバー","part_type":"blade","generation":"Beyblade X","product_code":"UX-09","type":"unknown","notes":"Takara Tomy Unique Line blade from starter UX-09 Samurai Saber 2-70L (released 2024-11-02). Official JP copy: Unique Line puts more blade metal on the outer rim; opening/closing blade gimmick plus a three-stage attack-speed bit, combining a high-power single-hit mode with a lower-power multi-hit mode. Cited pages do not print Attack/Defense/Stamina/Balance on the blade alone; type left unknown. Pack also includes a Hold Launcher, Long Winder, and four rubber grip panels (tools, not catalogued as parts here).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux09.html","label":"Takara Tomy UX-09 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-09)","kind":"official"}]},{"id":"knight-mail","name":"Knight Mail","name_ja":"ナイトメイル","part_type":"blade","generation":"Beyblade X","product_code":"UX-10","type":"unknown","notes":"Takara Tomy Unique Line blade from set UX-10 Customize Set U (released 2024-11-02). Official JP copy: Unique Line puts more blade metal on the outer rim; set includes 4 blades / 3 ratchets / 6 bits. Featured combo ナイトメイル3-85BS uses a blade with built-in metal balls that absorb vertical impact plus a bit that sinks to cushion hits, specialized for softening landing shock and up/down attacks. UX-00 limited booster repeats the same Unique Line copy for ナイトメイル3-85BS. Cited pages do not print Attack/Defense/Stamina/Balance on the blade alone; type left unknown. UX-10 manual lists ブレード【ナイトメイル】.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux10.html","label":"Takara Tomy UX-10 Customize Set U","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux00-nm.html","label":"Takara Tomy UX-00 Knight Mail 3-85BS Metal Coat: Navy","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/UX-10_manual.pdf","label":"Takara Tomy UX-10 instruction manual (PDF)","kind":"official"}]},{"id":"ptera-swing","name":"Ptera Swing","name_ja":"プテラスイング","part_type":"blade","generation":"Beyblade X","product_code":"UX-10","type":"unknown","notes":"Takara Tomy Unique Line blade included in UX-10 Customize Set U (released 2024-11-02). Official UX-10 manual lists ブレード【プテラスイング】 among the four included blades (with Knight Mail plus special-color Tyranno Beat and Hells Hammer reprints). Product page states the set has four blades but does not describe Ptera Swing performance separately; type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/UX-10_manual.pdf","label":"Takara Tomy UX-10 instruction manual (PDF) (ブレード【プテラスイング】)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux10.html","label":"Takara Tomy UX-10 product page (4 blades in set)","kind":"official"}]},{"id":"impact-drake","name":"Impact Drake","name_ja":"インパクトドレイク","part_type":"blade","generation":"Beyblade X","product_code":"UX-11","type":"attack","notes":"Takara Tomy Unique Line blade from starter UX-11 Impact Drake 9-60LR (official page date 2024-12-28). Official JP copy: Unique Line puts more blade metal on the outer rim; thick four-blade with high-rebound rubber, a low ratchet, and a bit described as good at upper attacks, specialized for knocking the opponent away more strongly. Ships with a special-color String Launcher. Attack label is from that knock-away product copy, not a separate printed type badge.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux11.html","label":"Takara Tomy UX-11 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-11)","kind":"official"}]},{"id":"golem-rock","name":"Golem Rock","name_ja":"ゴーレムロック","part_type":"blade","generation":"Beyblade X","product_code":"UX-13","type":"unknown","notes":"Takara Tomy Unique Line blade from booster UX-13 Golem Rock 1-60UN (official page date 2025-01-25). Official JP copy: Unique Line puts more blade metal on the outer rim; early in battle the Bey takes hits horizontally, then when it tilts late-game the high-repel blade and ratchet aim for a low-position counter. Cited pages do not print Attack/Defense/Stamina/Balance on the blade alone; type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux13.html","label":"Takara Tomy UX-13 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-13)","kind":"official"}]},{"id":"scorpio-spear","name":"Scorpio Spear","name_ja":"スコーピオスピア","part_type":"blade","generation":"Beyblade X","product_code":"UX-14","type":"unknown","notes":"Takara Tomy Unique Line blade from starter UX-14 Scorpio Spear 0-70Z (official page date 2025-04-26). Official JP copy: Unique Line puts more blade metal on the outer rim; during X Dash the blade transforms in sync with bit rotation from a round six-blade (high slip-away defense) to a three-blade (high attack). Ships with a Long Winder Launcher. Cited pages do not print a single Attack/Defense/Stamina/Balance label for the blade; type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux14.html","label":"Takara Tomy UX-14 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-14)","kind":"official"}]},{"id":"shark-scale","name":"Shark Scale","name_ja":"シャークスケイル","part_type":"blade","generation":"Beyblade X","product_code":"UX-15","type":"attack","notes":"Takara Tomy Unique Line blade from set UX-15 Shark Scale Deck Set (official page date 2025-08-09). Official JP copy: three Attack Type Beys, one each from BX / UX / CX lines; featured combo シャークスケイル4-50UF is a low-position upper-attack blade plus a low-height ratchet and bit, described as getting inside the opponent's guard to aim for burst or over finishes. Attack label is from that official Attack Type / upper-attack product description.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux15.html","label":"Takara Tomy UX-15 Shark Scale Deck Set","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-15)","kind":"official"}]},{"id":"meteor-dragoon","name":"Meteor Dragoon","name_ja":"メテオドラグーン","part_type":"blade","generation":"Beyblade X","product_code":"UX-17","type":"attack","notes":"Takara Tomy Unique Line left-spin blade from starter UX-17 Meteor Dragoon 3-70J (official page date 2025-12-27). Official JP copy: Unique Line puts more blade metal on the outer rim; left-spin blade with large rubber blades plus attack-oriented parts, described as absorbing a right-spin opponent's rotation and delivering repeated strong hits. Ships with a large-grip Dragon Winder and Winder Launcher L. Attack label is from that official combo description.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux17.html","label":"Takara Tomy UX-17 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-17)","kind":"official"}]},{"id":"mummy-curse","name":"Mummy Curse","name_ja":"マミーカース","part_type":"blade","generation":"Beyblade X","product_code":"UX-18","type":"defense","notes":"Takara Tomy Unique Line blade; prize Bey of random booster UX-18 Vol.8 (official page date 2025-12-27). Official JP copy: rare is マミーカース7-55W; switches from counter form to guard form depending on spin speed, showing different defense performance early vs late in battle. Defense label is from that official prize-combo description. Other slots are special-color customized Beys (not named as new blades on the cited page).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux18.html","label":"Takara Tomy UX-18 Random Booster Vol.8","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-18 ランダムブースター)","kind":"official"}]},{"id":"bullet-griffon","name":"Bullet Griffon","name_ja":"バレットグリフォン","part_type":"blade","generation":"Beyblade X","product_code":"UX-19","type":"balance","notes":"Takara Tomy Unique Line Expand Blade from starter UX-19 Bullet Griffon H (official page date 2026-04-25). Official JP copy / Gear Structure: Unique Line Expand Blade integrates the ratchet into a Unique Line blade to extend its specialized performance. Balance Type Beyblade that can fight as two units during battle — a 'bullet' that splits off to damage the opponent and a long-spinning main body. Ships with a Long Winder Launcher. Balance label is from that official product description. Cited pages do not expand the trailing H letter as a separate catalogued bit name.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux19.html","label":"Takara Tomy UX-19 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Unique Line Expand Blade)","kind":"official"}]},{"id":"glory-valkyrie","name":"Glory Valkyrie","name_ja":"グローリーワルキューレ","part_type":"blade","generation":"Beyblade X","product_code":"UX-20","type":"attack","notes":"Takara Tomy Unique Line Expand Blade from starter UX-20 Glory Valkyrie LF (official page date 2026-07-11). Official JP copy / Gear Structure: Unique Line Expand Blade integrates the ratchet into a Unique Line blade. Attack Type Beyblade that runs a bouncing blade on a bit described as good at high-speed X Dash, excelling at knocking the opponent far away. Ships with a special-color String Launcher. Attack label is from that official product description. Cited pages do not expand the trailing LF letters as a separate catalogued bit name.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux20.html","label":"Takara Tomy UX-20 product page","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Unique Line Expand Blade)","kind":"official"}]},{"id":"hells-nether","name":"Hells Nether","name_ja":"ヘルズネザー","part_type":"blade","generation":"Beyblade X","product_code":"UX-21","type":"balance","notes":"Takara Tomy Unique Line Expand Blade from set UX-21 Hells Nether Deck Set (official page date 2026-08-08). Official JP copy: three-Bey deck set; featured Unique Line Expand Blade ヘルズネザーZ pairs a height-switching blade with a bit that has both attack and defense traits, described as a Balance Type Beyblade that can pick a favorable tactic by opponent. Balance label is from that official product description. Cited pages do not expand the trailing Z letter as a separate catalogued bit name.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux21.html","label":"Takara Tomy UX-21 Hells Nether Deck Set","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Unique Line Expand Blade)","kind":"official"}]},{"id":"aero-pegasus","name":"Aero Pegasus","name_ja":"エアロペガサス","part_type":"blade","generation":"Beyblade X","product_code":"UX-00","type":"attack","notes":"Takara Tomy Unique Line blade from app/event-limited UX-00 Aero Pegasus 3-70A packs (Red Ver. official page date 2026-02-21; earlier Double Metal Coat Blue×Green campaign also used UX-00). Official JP copy: Unique Line puts more blade metal on the outer rim; heavy blade plus high-attack parts, specialized for attack power. Attack label is from that official product description.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux00-ap_red.html","label":"Takara Tomy UX-00 Aero Pegasus 3-70A Red Ver.","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/news/news250715_2.html","label":"Takara Tomy UX-00 Aero Pegasus 3-70A Double Metal Coat notice","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-00 エアロペガサス)","kind":"official"}]},{"id":"ratchet-3-70","name":"3-70","name_ja":"3-70","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-02","type":"unknown","notes":"Height/contact ratchet printed in Unique Line starter UX-02 Hells Hammer 3-70H. Official pages name it only as the 3-70 segment of the product name. Also used on UX-17 Meteor Dragoon 3-70J. Ratchets are not a printed Attack/Defense/Stamina/Balance type; type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux02.html","label":"Takara Tomy UX-02 product page (3-70 in ヘルズハンマー3-70H)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux17.html","label":"Takara Tomy UX-17 product page (3-70 in メテオドラグーン3-70J)","kind":"official"}]},{"id":"ratchet-5-70","name":"5-70","name_ja":"5-70","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-03","type":"unknown","notes":"Height/contact ratchet printed in Unique Line booster UX-03 Wizard Rod 5-70DB. Official pages name it only as the 5-70 segment of the product name. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux03.html","label":"Takara Tomy UX-03 product page (5-70 in ウィザードロッド5-70DB)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-03)","kind":"official"}]},{"id":"ratchet-7-60","name":"7-60","name_ja":"7-60","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-06","type":"unknown","notes":"Height/contact ratchet printed in Unique Line booster UX-06 Leon Crest 7-60GN. Official JP copy pairs a wall-like blade with this ratchet to repel attacks from any direction. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux06.html","label":"Takara Tomy UX-06 product page (7-60 in レオンクレスト7-60GN)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Ratchet role)","kind":"official"}]},{"id":"ratchet-9-70","name":"9-70","name_ja":"9-70","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-07","type":"unknown","notes":"Height/contact ratchet printed in Unique Line featured combo UX-07 Phoenix Rudder 9-70G. Official pages name it only as the 9-70 segment of that product name. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux07.html","label":"Takara Tomy UX-07 product page (9-70 in フェニックスラダー9-70G)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-07)","kind":"official"}]},{"id":"ratchet-2-70","name":"2-70","name_ja":"2-70","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-09","type":"unknown","notes":"Height/contact ratchet printed in Unique Line starter UX-09 Samurai Saber 2-70L. Official pages name it only as the 2-70 segment of the product name. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux09.html","label":"Takara Tomy UX-09 product page (2-70 in サムライセイバー2-70L)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-09)","kind":"official"}]},{"id":"ratchet-3-85","name":"3-85","name_ja":"3-85","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-10","type":"unknown","notes":"Height/contact ratchet printed in Unique Line featured combo UX-10 Knight Mail 3-85BS. UX-10 manual lists ラチェット【3-85】. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux10.html","label":"Takara Tomy UX-10 product page (3-85 in ナイトメイル3-85BS)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/UX-10_manual.pdf","label":"Takara Tomy UX-10 instruction manual (PDF) (ラチェット【3-85】)","kind":"official"}]},{"id":"ratchet-7-70","name":"7-70","name_ja":"7-70","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-10","type":"unknown","notes":"Height/contact ratchet included in Unique Line UX-10 Customize Set U. Official UX-10 manual lists ラチェット【7-70】 among the three included ratchets (with 3-85 and 1-60). Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/UX-10_manual.pdf","label":"Takara Tomy UX-10 instruction manual (PDF) (ラチェット【7-70】)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux10.html","label":"Takara Tomy UX-10 product page (3 ratchets in set)","kind":"official"}]},{"id":"ratchet-0-70","name":"0-70","name_ja":"0-70","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-14","type":"unknown","notes":"Height/contact ratchet printed in Unique Line starter UX-14 Scorpio Spear 0-70Z. Official pages name it only as the 0-70 segment of the product name. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux14.html","label":"Takara Tomy UX-14 product page (0-70 in スコーピオスピア0-70Z)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-14)","kind":"official"}]},{"id":"ratchet-4-50","name":"4-50","name_ja":"4-50","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-15","type":"unknown","notes":"Height/contact ratchet printed in Unique Line featured combo UX-15 Shark Scale 4-50UF. Official JP copy describes the ratchet as lowering height with the blade and bit for a low-position upper attack. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux15.html","label":"Takara Tomy UX-15 product page (4-50 in シャークスケイル4-50UF)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-15)","kind":"official"}]},{"id":"ratchet-9-65","name":"9-65","name_ja":"9-65","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-16","type":"unknown","notes":"Height/contact ratchet printed in Unique Line random-booster UX-16 Clock Mirage 9-65B. Official JP copy pairs a circular 60-blade with this low ratchet and a high-stamina bit; official note: blade クロックミラージュ can only be attached to simple-type ratchets. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux16.html","label":"Takara Tomy UX-16 product page (9-65 in クロックミラージュ9-65B)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-16)","kind":"official"}]},{"id":"ratchet-7-55","name":"7-55","name_ja":"7-55","part_type":"ratchet","generation":"Beyblade X","product_code":"UX-18","type":"unknown","notes":"Height/contact ratchet printed in Unique Line random-booster prize combo UX-18 Mummy Curse 7-55W. Official pages name it only as the 7-55 segment of the product name. Type left unknown.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux18.html","label":"Takara Tomy UX-18 product page (7-55 in マミーカース7-55W)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (UX-18)","kind":"official"}]},{"id":"bit-wedge","name":"W (Wedge)","name_ja":"W（ウェッジ）","part_type":"bit","generation":"Beyblade X","product_code":"UX-18","type":"unknown","notes":"Shaft-tip bit. Takara Tomy Plus One Bit campaign expands W as ウェッジ (Wedge). First listed on Unique Line random-booster prize UX-18 Mummy Curse 7-55W. Cited pages do not print Attack/Defense/Stamina/Balance for W; type left unknown. Do not confuse with Custom Line assist-blade letter W (Wheel).","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/news/news260615_6.html","label":"Takara Tomy Plus One Bit campaign (W/ウェッジ)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/ux18.html","label":"Takara Tomy UX-18 product page (7-55W)","kind":"official"}]},{"id":"brave","name":"Brave","name_ja":"ブレイブ","part_type":"blade","generation":"Beyblade X","product_code":"CX-01","type":"attack","notes":"Takara Tomy Custom Line main blade named ブレイブ on the official CX CUP parts list. First listed on starter CX-01 Dran Brave S6-60V (lock chip Dran + main blade Brave + assist blade S/Slash + ratchet 6-60 + bit V; official page date 2025-03-29). Official JP copy: Custom Line blades disassemble into three parts; this blade uses downforce to raise attack performance, paired with a bit that can attack at high speed when spinning right, improving acceleration and knock-away. Attack label is from that official blade copy, not a separate printed type badge.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/event/g2_cxcup2026_list.html","label":"Takara Tomy CX CUP legal parts list (main blade ブレイブ)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx01.html","label":"Takara Tomy CX-01 product page (ドランブレイブS6-60V)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (CX-01)","kind":"official"}]},{"id":"arc","name":"Arc","name_ja":"アーク","part_type":"blade","generation":"Beyblade X","product_code":"CX-02","type":"unknown","notes":"Takara Tomy Custom Line main blade named アーク on the official CX CUP parts list. First listed on starter CX-02 Wizard Arc R4-55LO (lock chip Wizard + main blade Arc + assist blade R/Round + ratchet 4-55 + bit LO; official page date 2025-03-29). Official JP copy: Custom Line three-part blade that generates strong centrifugal force; stock combo pairs it with a short ratchet and bit and is described as excelling at keeping stable spin. Cited pages do not print Attack/Defense/Stamina/Balance on this main blade alone; type left unknown. Product-name letters LO are not expanded on cited pages.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/event/g2_cxcup2026_list.html","label":"Takara Tomy CX CUP legal parts list (main blade アーク)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx02.html","label":"Takara Tomy CX-02 product page (ウィザードアークR4-55LO)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (CX-02)","kind":"official"}]},{"id":"dark","name":"Dark","name_ja":"ダーク","part_type":"blade","generation":"Beyblade X","product_code":"CX-03","type":"defense","notes":"Takara Tomy Custom Line main blade named ダーク on the official CX CUP parts list. First listed on booster CX-03 Perseus Dark B6-80W (lock chip Perseus + main blade Dark + assist blade B/Bumper + ratchet 6-80 + bit W; official page date 2025-03-29). Official JP copy: Custom Line blade with both impact absorption and counter performance; stock combo with a hard-to-tilt bit is described as shutting out attacks from any direction and draining the opponent's stamina. Defense label is from that official product description, not a separate printed type badge.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/event/g2_cxcup2026_list.html","label":"Takara Tomy CX CUP legal parts list (main blade ダーク)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx03.html","label":"Takara Tomy CX-03 product page (ペルセウスダークB6-80W)","kind": reviation, so it is not invented here.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/event/g2_cxcup2026_list.html","label":"Takara Tomy CX CUP legal parts list (main blade エクリプス)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx09.html","label":"Takara Tomy CX-09 product page (ソルエクリプスD5-70TK)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (CX-09)","kind":"official"}]},{"id":"hunt","name":"Hunt","name_ja":"ハント","part_type":"blade","generation":"Beyblade X","product_code":"CX-10","type":"stamina","notes":"Takara Tomy Custom Line main blade named ハント on the official CX CUP parts list. First listed on booster CX-10 Wolf Hunt F0-60DB (lock chip Wolf + main blade Hunt + assist blade F/Free + ratchet 0-60 + bit DB; official page date 2025-11-01). Official JP copy: free-spinning blades and multiple circular parts to deflect hits, with a striking blade that drains the opponent's stamina; described as a Stamina Type Beyblade. Stamina label is from that official product description.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/event/g2_cxcup2026_list.html","label":"Takara Tomy CX CUP legal parts list (main blade ハント)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx10.html","label":"Takara Tomy CX-10 product page (ウルフハントF0-60DB)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/","label":"Takara Tomy Beyblade X lineup (CX-10)","kind":"official"}]},{"id":"brush","name":"Brush","name_ja":"ブラッシュ","part_type":"blade","generation":"Beyblade X","product_code":"CX-06","type":"attack","notes":"Takara Tomy Custom Line main blade named ブラッシュ on the official CX CUP parts list. Featured Select-pack blade of random booster CX-06 Fox Brush Select (official page date 2025-05-17). Official JP copy: all three slots set 新ブレード「フォックスブラッシュJ」; featured combo フォックスブラッシュJ9-70GR is a blade with b ドVer.)","kind":"official"}]},{"id":"blitz","name":"Blitz","name_ja":"ブリッツ","part_type":"blade","generation":"Beyblade X","product_code":"CX-13","type":"attack","notes":"Takara Tomy Custom Line metal blade named ブリッツ on the official CX CUP parts list (Expand Blade; listed as 3月28日発売予定). First listed on starter CX-13 Bahamut Blitz BK1-50I (lock chip Bahamut + over-blade B/Break + metal blade Blitz + assist blade K/Knuckle + ratchet 1-50 + bit I; official page date 2026-03-28). Official JP copy: Custom Line Expand Blade disassembles into four parts; concentrates heavy-hit points of blade and ratchet into one place to maximize single-hit attack, with a low center of gravity and high-speed movement; described as an Attack Type Beyblade. Attack label is from that official product description. Also included as special-color バハムートブリッツBK in CX-16 Start Dash Set C.","sources":[{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/event/g2_cxcup2026_list.html","label":"Takara Tomy CX CUP legal parts list (metal blade ブリッツ)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx13.html","label":"Takara Tomy CX-13 product page (バハムートブリッツBK1-50I)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/manual/CX-13_manual.pdf","label":"Takara Tomy CX-13 manual (メタルブレード/ブリッツ)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/beyblade-x/lineup/cx16.html","label":"Takara Tomy CX-16 Start Dash Set C (special-color バハムートブリッツBK)","kind":"official"},{"url":"https://beyblade.takaratomy.co.jp/gear/","label":"Takara Tomy Gear Structure (Custom Line Expand Blade)","kind":"official"}]},{"id":"fortress","name":"Fortress","name_ja":"フォートレス","part_type":"blade","generation":"Beyblade X","product_code":"CX-14","type":"defense","notes":"Takara Tomy Custom Line metal blade named フォートレス on the official CX CUP parts list (Expand Blade; listed as 3月28日発売予定). First listed on starter CX-14 Knight Fortress GV8-70UN (lock chip Knight + over-blade G/Gu
