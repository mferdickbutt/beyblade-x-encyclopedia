<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beyblade X · Parts encyclopedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1c1f;
      --muted: #5c6370;
      --paper: #f3f0ea;
      --paper-2: #e8e3da;
      --rail: #0e7c7b;
      --rail-bright: #19b5b3;
      --burst: #d62828;
      --line: rgba(26, 28, 31, 0.12);
      --shadow: 0 18px 50px rgba(26, 28, 31, 0.08);
      --font-display: "Anybody", "Arial Narrow", sans-serif;
      --font-body: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(25, 181, 179, 0.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(214, 40, 40, 0.12), transparent 50%),
        linear-gradient(165deg, var(--paper) 0%, var(--paper-2) 100%);
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(115deg, transparent 0 46%, rgba(14, 124, 123, 0.07) 46% 54%, transparent 54%),
        linear-gradient(-115deg, transparent 0 46%, rgba(214, 40, 40, 0.05) 46% 54%, transparent 54%);
      opacity: 0.9;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    header.hero {
      display: grid;
      gap: 1rem;
      padding: 1.25rem 0 1.75rem;
      border-bottom: 1px solid var(--line);
      animation: rise 0.7s ease-out both;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.6rem, 8vw, 4.4rem);
      line-height: 0.92;
      letter-spacing: -0.03em;
      margin: 0;
      text-transform: uppercase;
    }

    .brand span {
      color: var(--burst);
    }

    .lede {
      margin: 0;
      max-width: 36rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      gap: 0.85rem;
      margin-top: 1.5rem;
      animation: rise 0.8s 0.08s ease-out both;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
      align-items: center;
    }

    input[type="search"] {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(6px);
      border-radius: 0;
      padding: 0.85rem 1rem;
      font: 500 1rem/1.2 var(--font-body);
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="search"]:focus {
      border-color: var(--rail);
      box-shadow: 0 0 0 3px rgba(14, 124, 123, 0.18);
    }

    .meta {
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .filters button {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font: 600 0.85rem/1 var(--font-body);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .filters button:hover {
      border-color: var(--rail);
      transform: translateY(-1px);
    }

    .filters button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .type-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .type-filters button {
      appearance: none;
      border: none;
      background: none;
      color: var(--muted);
      font: 500 0.9rem/1.2 var(--font-body);
      padding: 0.35rem 0.45rem;
      cursor: pointer;
      text-decoration: underline transparent;
      text-underline-offset: 0.2em;
      transition: color 0.15s ease, text-decoration-color 0.15s ease;
    }

    .type-filters button:hover,
    .type-filters button[aria-pressed="true"] {
      color: var(--burst);
      text-decoration-color: currentColor;
    }

    main {
      margin-top: 1.75rem;
      display: grid;
      gap: 0.65rem;
      animation: rise 0.85s 0.14s ease-out both;
    }

    .part {
      border-top: 1px solid var(--line);
      padding: 0.15rem 0;
    }

    .part:last-child {
      border-bottom: 1px solid var(--line);
    }

    .part summary {
      list-style: none;
      cursor: pointer;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem 1rem;
      align-items: baseline;
      padding: 0.95rem 0.15rem;
      transition: background 0.2s ease;
    }

    .part summary::-webkit-details-marker { display: none; }

    .part summary:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .part[open] summary {
      background: rgba(255, 255, 255, 0.55);
    }

    .part-title {
      display: grid;
      gap: 0.2rem;
      min-width: 0;
    }

    .part-title h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 3vw, 1.65rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .part-title .ja {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.75rem;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badges .code {
      color: var(--rail);
    }

    .detail {
      padding: 0 0.15rem 1.2rem;
      display: grid;
      gap: 0.85rem;
      max-width: 46rem;
      animation: open 0.28s ease-out;
    }

    .detail p {
      margin: 0;
      line-height: 1.55;
      color: var(--ink);
    }

    .detail dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.35rem 1rem;
      margin: 0;
      font-size: 0.95rem;
    }

    .detail dt {
      color: var(--muted);
      font-weight: 600;
    }

    .detail dd {
      margin: 0;
    }

    .sources {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.4rem;
    }

    .sources a {
      color: var(--rail);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid rgba(14, 124, 123, 0.35);
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .sources a:hover {
      color: var(--burst);
      border-color: rgba(214, 40, 40, 0.45);
    }

    .empty {
      padding: 2.5rem 0.15rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }

    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
    }

    footer code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.84em;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes open {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .search-row {
        grid-template-columns: 1fr;
      }
      .part summary {
        grid-template-columns: 1fr;
      }
      .badges {
        justify-content: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1 class="brand">Beyblade <span>X</span></h1>
      <p class="lede">Sourced parts encyclopedia — blades, ratchets, bits, lock chips, and Custom Line letters with citations.</p>
    </header>

    <section class="controls" aria-label="Filters">
      <div class="search-row">
        <label class="visually-hidden" for="q" style="position:absolute;left:-9999px">Search parts</label>
        <input id="q" type="search" placeholder="Search name, Japanese, product code, notes…" autocomplete="off" />
        <div class="meta" id="count" aria-live="polite"></div>
      </div>
      <div class="filters" id="part-type-filters" role="group" aria-label="Part type"></div>
      <div class="type-filters" id="type-filters" role="group" aria-label="Battle type"></div>
    </section>

    <main id="list" aria-label="Parts"></main>

    <footer>
      Built from <code>data/parts.json</code>. Regenerate with <code>./scripts/build-html.sh</code>.
      Facts are sourced only — <code>unknown</code> means not printed on an official page.
    </footer>
  </div>

  <script>
    const PARTS = /*__PARTS_JSON__*/;

    const PART_TYPES = ["all", "blade", "ratchet", "bit", "lock_chip", "other"];
    const BATTLE_TYPES = ["all", "attack", "defense", "stamina", "balance", "unknown"];

    const labelPart = {
      all: "All parts",
      blade: "Blade",
      ratchet: "Ratchet",
      bit: "Bit",
      lock_chip: "Lock chip",
      other: "Other",
    };

    const labelType = {
      all: "Any type",
      attack: "Attack",
      defense: "Defense",
      stamina: "Stamina",
      balance: "Balance",
      unknown: "Unknown",
    };

    const state = {
      q: "",
      partType: "all",
      battleType: "all",
    };

    const listEl = document.getElementById("list");
    const countEl = document.getElementById("count");
    const qEl = document.getElementById("q");
    const partFiltersEl = document.getElementById("part-type-filters");
    const typeFiltersEl = document.getElementById("type-filters");

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function matches(part) {
      if (state.partType !== "all" && part.part_type !== state.partType) return false;
      if (state.battleType !== "all" && part.type !== state.battleType) return false;
      if (!state.q) return true;
      const hay = [
        part.id,
        part.name,
        part.name_ja,
        part.product_code,
        part.part_type,
        part.type,
        part.notes,
        ...(part.sources || []).flatMap((s) => [s.label, s.url]),
      ]
        .join("\n")
        .toLowerCase();
      return hay.includes(state.q);
    }

    function renderFilters(container, keys, labels, current, onPick) {
      container.innerHTML = "";
      for (const key of keys) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = labels[key];
        btn.setAttribute("aria-pressed", key === current ? "true" : "false");
        btn.addEventListener("click", () => onPick(key));
        container.appendChild(btn);
      }
    }

    function render() {
      renderFilters(partFiltersEl, PART_TYPES, labelPart, state.partType, (key) => {
        state.partType = key;
        render();
      });
      renderFilters(typeFiltersEl, BATTLE_TYPES, labelType, state.battleType, (key) => {
        state.battleType = key;
        render();
      });

      const filtered = PARTS.filter(matches);
      countEl.textContent = `${filtered.length} / ${PARTS.length}`;

      if (!filtered.length) {
        listEl.innerHTML = `<p class="empty">No parts match those filters.</p>`;
        return;
      }

      listEl.innerHTML = filtered
        .map((part) => {
          const sources = (part.sources || [])
            .map(
              (s) =>
                `<li><a href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(
                  s.label || s.url
                )}</a></li>`
            )
            .join("");
          return `
            <details class="part" id="${escapeHtml(part.id)}">
              <summary>
                <div class="part-title">
                  <h2>${escapeHtml(part.name)}</h2>
                  <div class="ja">${escapeHtml(part.name_ja)}</div>
                </div>
                <div class="badges">
                  <span>${escapeHtml(labelPart[part.part_type] || part.part_type)}</span>
                  <span>${escapeHtml(labelType[part.type] || part.type)}</span>
                  <span class="code">${escapeHtml(part.product_code)}</span>
                </div>
              </summary>
              <div class="detail">
                <dl>
                  <dt>Id</dt><dd><code>${escapeHtml(part.id)}</code></dd>
                  <dt>Generation</dt><dd>${escapeHtml(part.generation)}</dd>
                </dl>
                <p>${escapeHtml(part.notes)}</p>
                <ul class="sources">${sources}</ul>
              </div>
            </details>
          `;
        })
        .join("");
    }

    let searchTimer = 0;
    qEl.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.q = qEl.value.trim().toLowerCase();
        render();
      }, 80);
    });

    render();

    if (location.hash) {
      const target = document.getElementById(location.hash.slice(1));
      if (target) {
        target.open = true;
        target.scrollIntoView({ block: "start" });
      }
    }
  </script>
</body>
</html>
